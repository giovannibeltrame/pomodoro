<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadrantic Pomodoro - Idle (light)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'body-md': ['Geist', 'sans-serif'],
            'body-sm': ['Geist', 'sans-serif'],
            'headline-sm': ['Geist', 'sans-serif'],
            'label-md': ['JetBrains Mono', 'monospace'],
            'label-sm': ['JetBrains Mono', 'monospace'],
            'display-timer': ['JetBrains Mono', 'monospace']
          },
          fontSize: {
            'display-timer': ['72px', { lineHeight: '72px', letterSpacing: '-0.03em' }],
            'headline-sm': ['16px', { lineHeight: '24px' }],
            'body-md': ['13px', { lineHeight: '20px' }],
            'body-sm': ['12px', { lineHeight: '18px' }],
            'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.02em' }],
            'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.04em' }]
          },
          borderRadius: {
            'ctrl': '4px',
            'panel': '8px'
          }
        }
      }
    };
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-[#fafafa] text-[#18181b] font-body-md min-h-screen flex flex-col select-none antialiased">
<header class="w-full px-8 py-3 flex items-center justify-between border-b border-[#e4e4e7] bg-[#ffffff] top-0 z-30">
<div class="flex items-center gap-3">
<span class="text-headline-sm font-headline-sm uppercase tracking-widest text-[#18181b]">QUADRANTIC</span>
<span class="text-label-sm font-label-sm text-[#a1a1aa] tracking-wider pt-0.5">POMODORO</span>
</div>
<div class="flex items-center gap-6">
<nav class="flex items-center gap-1 text-label-md font-label-md bg-[#fafafa] border border-[#e4e4e7] rounded-[6px] p-1"><a class="text-[#18181b] bg-[#ffffff] border-b-2 border-[#18181b] font-medium px-3 py-1 rounded-[4px]" href="#classic">Classic</a><a class="text-[#a1a1aa] px-3 py-1" href="#deep">Deep</a></nav>
<button aria-label="Open settings" class="text-[#52525b] flex items-center justify-center p-1 rounded-ctrl" type="button"><span class="material-symbols-outlined">settings</span></button>
</div>
</header>
<div class="flex-1 flex w-full">
<main class="flex-1 flex flex-col items-center justify-start pt-8 pb-16 px-6">
<div class="max-w-[620px] w-full flex flex-col items-center text-center">
<div class="w-[180px] h-[180px] flex items-center justify-center mb-1">
<svg class="w-[180px] h-[180px]" viewBox="0 0 32 32"><g fill="none" stroke="#d4d4d8" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M16 4v4"/><path d="M16 8c-2.5-3-6-2.5-7.5-1.5 1 2 2.5 3.5 5.5 3.5"/><path d="M16 8c2.5-3 6-2.5 7.5-1.5-1 2-2.5 3.5-5.5 3.5"/><path d="M16 8l-2 3"/><path d="M16 8l2 3"/><path d="M16 10c-6.8 0-11 4.5-11 11.2C5 26.5 9.5 29 16 29s11-2.5 11-7.8C27 14.5 22.8 10 16 10z"/></g></svg>
</div>
<div class="font-label-sm text-label-sm uppercase tracking-wider text-[#a1a1aa]">FOCUS · Block 1 of 4</div>
<div class="font-display-timer text-display-timer tabular-nums text-[#18181b] font-normal mt-2 mb-6 tracking-tight">25:00</div>
<div class="flex items-center justify-center">
<button class="bg-[#ffffff] border border-[#e4e4e7] text-[#a1a1aa] cursor-not-allowed font-label-md text-label-md uppercase tracking-wider px-6 py-2 rounded-ctrl" disabled type="button">START</button>
<button class="font-label-md text-label-md text-[#a1a1aa] ml-4" type="button">Reset</button>
</div>
<div class="w-full text-left mt-8 flex flex-col gap-5">
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-[#a1a1aa]">QUADRANT</span>
<span class="font-body-sm text-body-sm text-[#a1a1aa]">Choose a quadrant and role to start</span>
</div>
<div class="grid grid-cols-4 gap-3">
<button class="bg-[#ffffff] border border-[#e4e4e7] rounded-panel p-3 text-left flex flex-col justify-between h-[76px]" type="button"><div class="flex items-center justify-between w-full"><span class="font-label-md text-label-md font-medium text-[#ef4444]">Q1 Do</span><span class="w-1.5 h-1.5 rounded-full bg-[#ef4444] inline-block"></span></div><span class="font-body-sm text-body-sm text-[#a1a1aa] leading-tight">Urgent · Important</span></button>
<button class="bg-[#ffffff] border border-[#e4e4e7] rounded-panel p-3 text-left flex flex-col justify-between h-[76px]" type="button"><div class="flex items-center justify-between w-full"><span class="font-label-md text-label-md font-medium text-[#6366f1]">Q2 Schedule</span><span class="w-1.5 h-1.5 rounded-full bg-[#6366f1] inline-block"></span></div><span class="font-body-sm text-body-sm text-[#a1a1aa] leading-tight">Important · Not urgent</span></button>
<button class="bg-[#ffffff] border border-[#e4e4e7] rounded-panel p-3 text-left flex flex-col justify-between h-[76px]" type="button"><div class="flex items-center justify-between w-full"><span class="font-label-md text-label-md font-medium text-[#d97706]">Q3 Delegate</span><span class="w-1.5 h-1.5 rounded-full bg-[#d97706] inline-block"></span></div><span class="font-body-sm text-body-sm text-[#a1a1aa] leading-tight">Urgent · Not important</span></button>
<button class="bg-[#ffffff] border border-[#e4e4e7] rounded-panel p-3 text-left flex flex-col justify-between h-[76px]" type="button"><div class="flex items-center justify-between w-full"><span class="font-label-md text-label-md font-medium text-[#71717a]">Q4 Eliminate</span><span class="w-1.5 h-1.5 rounded-full bg-[#71717a] inline-block"></span></div><span class="font-body-sm text-body-sm text-[#a1a1aa] leading-tight">Neither</span></button>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-[#a1a1aa]">ROLE</label>
<button class="w-full bg-[#ffffff] border border-[#e4e4e7] rounded-ctrl px-4 py-2.5 flex items-center justify-between text-[#52525b] text-left font-body-md text-body-md" type="button"><span>Select a role</span><span class="material-symbols-outlined text-[#a1a1aa] text-sm">expand_more</span></button>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-[#a1a1aa]">INTENTION (OPTIONAL)</label>
<input class="w-full bg-[#ffffff] border border-[#e4e4e7] rounded-ctrl px-4 py-2.5 text-[#18181b] placeholder-[#a1a1aa] font-body-md text-body-md" placeholder="What will you work on?" type="text"/>
</div>
</div>
</div>
</main>
<aside class="w-[300px] shrink-0 border-l border-[#e4e4e7] bg-[#ffffff] p-6 flex flex-col">
<h2 class="font-headline-sm text-headline-sm font-medium text-[#18181b]">Today</h2>
<div class="font-label-sm text-label-sm text-[#a1a1aa] mt-1 tabular-nums">0 blocks · 0h00 focus</div>
<div class="border-t border-[#e4e4e7] my-4"></div>
<p class="font-body-md text-body-md text-[#a1a1aa] leading-relaxed">No blocks yet today. Start your first focus block.</p>
</aside>
</div>
</body>
</html>

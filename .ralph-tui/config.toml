configVersion = "2.1"
tracker = "beads-bv"
# ralph-tui stops a run after this many iterations, each one agent run on one task; 0 means no limit.
maxIterations = 10
autoCommit = true

[errorHandling]
strategy = "retry"
maxRetries = 2
continueOnNonZeroExit = false

[parallel]
directMerge = true

# ralph-tui's beads trackers find no tasks unless this directory exists; a run worktree lacks it
# when nothing under .beads/ is committed, and bd finds the main checkout's database itself.
[trackerOptions]
beadsDir = "../../../.beads"

[[agents]]
name = "claude"
plugin = "claude"
command = ".ralph-tui/bin/worker"
defaultFlags = [
  "claude", "--permission-prompts", "none", "--permission-mode", "acceptEdits", "--chrome",
  "--allowedTools", "Bash(gh issue view *)", "Bash(mise exec -- pnpm exec prettier *)",
  "Bash(mise exec -- pnpm dev *)", "Bash(mise exec -- pnpm preview *)",
  "mcp__claude-in-chrome__*",
]

[agents.options]
skipPermissions = false
